
name: Python CI/CD - FastAPI, Docker and Docker Hub

on:
  push:

jobs:

  # ==============================
  # CI : Tests et vérifications
  # ==============================
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]

    steps:
      # 1. Récupérer le code GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 3. Installer les dépendances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pylint pytest pytest-cov httpx

      # 4. Vérifier la qualité du code
      - name: Run Pylint
        run: |
          pylint $(git ls-files '*.py')

      # 5. Exécuter les tests Python et FastAPI
      - name: Run Pytest with Coverage
        run: |
          python -m pytest --cov=trick --cov=api --cov-report=term-missing

      # 6. Construire l'image Docker
      - name: Build Docker image
        run: |
          docker build -t learningpython-api:1.0 .

      # 7. Démarrer FastAPI dans Docker et tester /health
      - name: Test FastAPI inside Docker
        run: |
          docker run -d \
            --name learningpython-api \
            -p 8000:8000 \
            learningpython-api:1.0

          for i in {1..15}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "FastAPI fonctionne dans Docker"
              exit 0
            fi
            sleep 2
          done

          docker logs learningpython-api
          exit 1

      # 8. Nettoyer le conteneur
      - name: Stop Docker container
        if: always()
        run: |
          docker rm -f learningpython-api || true

  # ==============================
  # CD : Publication Docker Hub
  # ==============================
  publish:
    needs: build
    runs-on: ubuntu-latest

    # Publication uniquement sur main
    if: github.ref == 'refs/heads/main'

    steps:
      # 9. Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 10. Configurer Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 11. Connexion à Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 12. Construire et publier l'image FastAPI
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            rabah94azi/learningpython:latest
            rabah94azi/learningpython:${{ github.sha }}
