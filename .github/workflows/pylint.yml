
name: Python CI - Pylint, Pytest and Docker

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]

    steps:
      # 1. Récupérer le code depuis GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installer la version de Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 3. Installer les dépendances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pylint pytest pytest-cov numpy

      # 4. Vérifier la qualité du code
      - name: Run Pylint
        run: |
          pylint $(git ls-files '*.py')

      # 5. Exécuter les tests et mesurer la couverture
      - name: Run Pytest with Coverage
        run: |
          python -m pytest --cov=trick --cov-report=term-missing

      # 6. Construire l'image Docker
      - name: Build Docker image
        run: |
          docker build -t learningpython:1.0 .

      # 7. Exécuter les tests dans Docker
      - name: Run tests inside Docker
        run: |
          docker run --rm learningpython:1.0
